<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Book Details — Shelf card (Direction A1, revised)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#faf6ee',
            card: '#fffdf8',
            ink: '#30291f',
            secondary: '#685d4d',
            btnFill: '#3e3225',
            btnText: '#fffaf1',
            divider: '#ded3c1',
            mutedBorder: '#e7decb',
          },
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
            sans: ['"Manrope"', 'sans-serif'],
          }
        }
      }
    };
  </script>
<style>
    body {
      background-color: #faf6ee;
      color: #30291f;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-serif {
      font-family: 'EB Garamond', serif;
    }
  </style>
</head>
<body class="bg-page text-ink min-h-screen flex justify-center selection:bg-[#ded3c1]/50">
<!-- Phone Frame (390px fixed width target) -->
<div class="w-full max-w-[390px] bg-page min-h-screen flex flex-col relative px-5 pb-12 pt-3"><!-- 1. TOP BAR (y ~ 12px to 64px) with 48x48 touch targets -->
<header class="flex items-center justify-between h-12 w-full mb-4">
<button aria-label="Back to Library" class="text-ink font-sans text-[16px] font-medium tracking-tight hover:opacity-80 active:opacity-60 transition-opacity inline-flex items-center gap-1.5 focus:outline-none h-12 pr-3" type="button">
<span aria-hidden="true" class="text-xl leading-none">‹</span>
<span>Library</span>
</button>
<button aria-label="More options" class="w-12 h-12 flex items-center justify-center rounded-full text-ink hover:bg-[#ded3c1]/30 active:opacity-60 transition-all focus:outline-none" title="More options" type="button">
<span class="text-2xl tracking-widest font-sans leading-none">⋯</span>
</button>
</header>
<!-- 2. HORIZONTAL BOOK HEADER: Cover 112x168 beside Title & Author -->
<section class="flex gap-4 items-start">
<div class="w-[112px] h-[168px] flex-shrink-0 rounded-[4px] overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-divider/60 bg-[#eae2d3]">
<img alt="Cover of A Quiet Practice by Mira Vale" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDR_A-2IkWJ_TDi9ncw8GVU6UETDCzffDadETdjLPif1zZD_InFXhtolKBaptutM1SJgwseoUVeqzYEj8uK2TACZ7Nb3rhoc--7WOw2BrYvYmjVqC1viztlCXLwhnPPOGvDgelCEFpksZlrIwrPDcmh5l4y5CyNlW1ngSg0mazktsQ8c--FsrZmaaB2d1Hu9pzytAUzem2FylmG10bzIXlwASdjrPdn6dIQ5QoXg-25XaWuRj3f8rfxJiF_-VXuvtbcBXKdiEwYtJYo" style="width: 112px; height: 168px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);"/>
</div>
<div class="flex-1 min-w-0 flex flex-col pt-1">
<h1 class="font-serif text-[28px] leading-tight font-medium text-[#221B14] tracking-[-0.01em] mb-1.5">
          A Quiet Practice
        </h1>
<p class="font-sans text-[16px] text-[#6A5E52] font-normal">
          Mira Vale
        </p>
</div>
</section>
<!-- 3. STATUS ROW: Full-width segmented control directly below book header, 48px tall -->
<section class="mt-4">
<div aria-label="Reading status" class="w-full h-12 bg-[#efe9dc] p-[2px] rounded-lg border border-divider/70 grid grid-cols-3 items-center text-[16px] font-sans font-medium text-secondary" role="radiogroup" style="height: 48px;">
<button aria-checked="false" class="h-full flex items-center justify-center rounded-[6px] text-[#6A5E52] hover:text-ink transition-colors focus:outline-none whitespace-nowrap text-[16px] font-medium" role="radio" type="button">
          Want to read
        </button>
<button aria-checked="true" class="h-full flex items-center justify-center rounded-[6px] bg-card text-[#221B14] shadow-[0_1px_3px_rgba(48,41,31,0.08)] border border-divider/40 font-medium focus:outline-none whitespace-nowrap text-[16px]" role="radio" type="button">
          Reading
        </button>
<button aria-checked="false" class="h-full flex items-center justify-center rounded-[6px] text-[#6A5E52] hover:text-ink transition-colors focus:outline-none whitespace-nowrap text-[16px] font-medium" role="radio" type="button">
          Finished
        </button>
</div>
<p class="text-[14px] text-secondary font-sans mt-2 font-normal">
        Started 2 Oct
      </p>
</section>
<!-- 4. YOUR NOTES SECTION (STATIC PREVIEW CARDS) -->
<section class="mt-5">
<div class="flex items-baseline justify-between mb-3">
<h2 class="font-serif text-[22px] font-medium text-[#221B14]">
          Your notes
        </h2>
<span class="font-sans text-[16px] text-[#6A5E52] font-normal">
          3 notes
        </span>
</div>
<div class="space-y-3">
<!-- Card 1: Quote (Static preview) -->
<div class="bg-card rounded-lg p-3.5 border border-mutedBorder shadow-[0_1px_2px_rgba(48,41,31,0.04)]">
<div class="text-[14px] font-sans text-secondary font-normal mb-1.5">
            Quote · p. 42 · 14 Oct
          </div>
<p class="font-serif italic text-[18px] leading-[1.4] text-ink font-normal">
            “Attention grows when we give one task our time.”
          </p>
</div>
<!-- Card 2: Thought (Static preview) -->
<div class="bg-card rounded-lg p-3.5 border border-mutedBorder shadow-[0_1px_2px_rgba(48,41,31,0.04)]">
<div class="text-[14px] font-sans text-secondary font-normal mb-1.5">
            Thought · 12 Oct
          </div>
<p class="font-sans text-[16px] leading-[1.4] text-ink font-normal">
            I keep noticing how often I split my attention while reading on the train.
          </p>
</div>
</div>
<!-- 5. PRIMARY BUTTON: Full-width 48px CTA 'Add note' (bottom edge above y=844px) -->
<button class="w-full mt-4 h-12 bg-btnFill text-btnText font-sans text-[16px] font-medium rounded-lg flex items-center justify-center hover:opacity-95 active:opacity-90 transition-opacity focus:outline-none shadow-[0_1px_3px_rgba(62,50,37,0.12)]" style="height: 48px;" type="button">
        Add note
      </button>
</section>
<!-- DP-01 Separation Spacer: Ensures no interactive elements start before y = 860px -->
<div class="pt-8 mt-4 border-t border-divider">
<!-- BELOW THE FOLD (y >= 860px): 56px hairline-separated quiet rows -->
<section class="divide-y divide-divider/70">
<!-- Row 1: All 3 notes -->
<button class="w-full min-h-[56px] py-3.5 flex items-center justify-between text-left group focus:outline-none" type="button">
<span class="font-sans text-[16px] font-normal text-ink group-hover:text-secondary transition-colors">
            All 3 notes
          </span>
<span aria-hidden="true" class="text-secondary text-base font-sans">›</span>
</button>
<!-- Row 2: My review -->
<button class="w-full min-h-[56px] py-3.5 flex items-center justify-between text-left group focus:outline-none gap-2" type="button">
<span class="font-sans text-[16px] font-normal text-ink flex-shrink-0 group-hover:text-secondary transition-colors">
            My review
          </span>
<span class="font-sans text-[16px] font-normal text-secondary truncate text-right flex-1 group-hover:text-ink transition-colors">
            A gentle book about doing less…
          </span>
<span aria-hidden="true" class="text-secondary text-base font-sans flex-shrink-0">›</span>
</button>
<!-- Row 3: Saved pages -->
<button class="w-full min-h-[56px] py-3.5 flex items-center justify-between text-left group focus:outline-none" type="button">
<span class="font-sans text-[16px] font-normal text-ink group-hover:text-secondary transition-colors">
            Saved pages
          </span>
<div class="flex items-center gap-2">
<span class="font-sans text-[16px] text-secondary font-normal">1 page</span>
<span aria-hidden="true" class="text-secondary text-base font-sans">›</span>
</div>
</button>
<!-- Row 4: Book information -->
<button class="w-full min-h-[56px] py-3.5 flex items-center justify-between text-left group focus:outline-none" type="button">
<span class="font-sans text-[16px] font-normal text-ink group-hover:text-secondary transition-colors">
            Book information
          </span>
<span aria-hidden="true" class="text-secondary text-base font-sans">›</span>
</button>
<!-- Row 5: Ownership & condition -->
<button class="w-full min-h-[56px] py-3.5 flex items-center justify-between text-left group focus:outline-none" type="button">
<span class="font-sans text-[16px] font-normal text-ink group-hover:text-secondary transition-colors">
            Ownership &amp; condition
          </span>
<span aria-hidden="true" class="text-secondary text-base font-sans">›</span>
</button>
</section>
<!-- VERY BOTTOM: REMOVE FROM LIBRARY (Manrope 16px) -->
<div class="mt-8 pt-2 pb-4 text-center">
<button class="font-sans text-[16px] font-normal text-secondary hover:text-ink active:opacity-70 transition-colors focus:outline-none underline-offset-4 hover:underline" type="button">
          Remove from library
        </button>
</div>
</div></div>
</body>
</html>
