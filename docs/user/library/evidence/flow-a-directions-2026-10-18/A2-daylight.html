<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details — Frontispiece (Direction A2)</title>
  <!-- Google Fonts: EB Garamond & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Reset & Custom Properties */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --color-page: #faf6ee;
      --color-ink: #30291f;
      --color-secondary: #685d4d;
      --color-hairline: #ded3c1;
      --color-btn-fill: #3e3225;
      --color-btn-text: #fffaf1;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f0ebe1;
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    /* Phone Canvas Container */
    .phone-container {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: var(--color-page);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 30px rgba(48, 41, 31, 0.08);
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 12px;
      position: sticky;
      top: 0;
      background-color: var(--color-page);
      z-index: 10;
    }

    .nav-btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 48px;
      padding: 0 12px;
      background: transparent;
      border: none;
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
    }

    .nav-btn-back:hover {
      background-color: rgba(62, 50, 37, 0.04);
    }

    .nav-btn-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: transparent;
      border: none;
      color: var(--color-ink);
      font-size: 20px;
      cursor: pointer;
      border-radius: 8px;
      letter-spacing: 1px;
    }

    .nav-btn-more:hover {
      background-color: rgba(62, 50, 37, 0.04);
    }

    /* Main Scrollable Content */
    .content-area {
      padding: 12px 24px 48px 24px;
      display: flex;
      flex-direction: column;
    }

    /* Above the fold: Frontispiece Hero */
    .frontispiece-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 4px;
      padding-bottom: 20px;
    }

    .cover-frame {
      width: 150px;
      height: 225px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 24px -4px rgba(48, 41, 31, 0.22), 0 2px 6px rgba(48, 41, 31, 0.1);
      margin-bottom: 20px;
      background-color: #e5ded0;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .book-title {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--color-ink);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .book-author {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 400;
      color: var(--color-secondary);
      margin-bottom: 18px;
    }

    /* Status Control */
    .status-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .status-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--color-hairline);
      border-radius: 20px;
      padding: 6px 16px 6px 18px;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      color: var(--color-ink);
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.5);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .status-pill-btn:hover {
      background-color: rgba(255, 255, 255, 0.85);
      border-color: #c9bea9;
    }

    .status-caret {
      font-size: 11px;
      color: var(--color-secondary);
      transform: translateY(1px);
    }

    .status-caption {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--color-secondary);
    }

    /* Hairline Divider */
    .hairline-divider {
      height: 1px;
      background-color: var(--color-hairline);
      width: 100%;
      border: none;
      margin: 20px 0;
    }

    /* Latest Note Section (Frontispiece printed passage, no card box) */
    .note-passage-section {
      padding: 4px 0 24px 0;
    }

    .note-metadata {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--color-secondary);
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .note-quote {
      font-family: var(--font-serif);
      font-size: 20px;
      line-height: 1.45;
      color: var(--color-ink);
      margin-bottom: 14px;
    }

    .note-all-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-ink);
      text-decoration: none;
      cursor: pointer;
    }

    .note-all-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Primary Action Button */
    .btn-primary {
      width: 100%;
      height: 52px;
      background-color: var(--color-btn-fill);
      color: var(--color-btn-text);
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      opacity: 0.94;
    }

    .btn-primary:active {
      opacity: 0.88;
    }

    /* Below the fold: Collapsed list rows */
    .details-list {
      display: flex;
      flex-direction: column;
      margin-top: 12px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-hairline);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .list-row:first-child {
      border-top: 1px solid var(--color-hairline);
    }

    .row-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 12px;
    }

    .row-label {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-ink);
    }

    .row-summary {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--color-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 290px;
    }

    .row-meta-single {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-caption-inline {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--color-secondary);
    }

    .chevron {
      color: var(--color-secondary);
      font-size: 16px;
      line-height: 1;
    }

    /* Destructive/Secondary text action */
    .remove-action-container {
      margin-top: 40px;
      text-align: center;
      padding-bottom: 12px;
    }

    .remove-action-btn {
      background: transparent;
      border: none;
      color: var(--color-secondary);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 8px;
      transition: color 0.15s ease;
    }

    .remove-action-btn:hover {
      color: var(--color-ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>

  <main class="phone-container" role="main">

    <!-- Top Navigation Bar (First 2 touch areas) -->
    <nav class="top-bar" aria-label="Book navigation">
      <button class="nav-btn-back" type="button" aria-label="Back to Library">
        ‹ Library
      </button>
      <button class="nav-btn-more" type="button" aria-label="More options">
        ⋯
      </button>
    </nav>

    <!-- Main Editorial Content -->
    <div class="content-area">

      <!-- Frontispiece Hero: Centred Cover & Typography -->
      <section class="frontispiece-hero" aria-label="Book overview">
        <div class="cover-frame">
          <img 
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuChrkwjugu8ZNXIASyDHNG9xcv2ae-v4lggARYXYokfEBVC26hW-UDfA_r9tYF74oZD6EDsPtf_6NzZbWo5pfr8Bd7fNP2L8kST0gzgAXTl4jLLjRInm_FEO6Kr3eOdc56kOsWVz55jXkAmY2D6-BAoDZyXbI6tMM8FSAyJ36UxiHdX6Klh8sZz0vWM4z1MDSoqD2tnc7I8EEhe8z1M3K8RDxexrRIvN8OB05LBaheupgrbnYnBJagiJOR397hcJmHTqtNd5JnpZRNf" 
            alt="Cloth-bound cover of A Quiet Practice by Mira Vale" 
            class="cover-img"
          >
        </div>

        <h1 class="book-title">A Quiet Practice</h1>
        <p class="book-author">Mira Vale</p>

        <!-- Status Control: Pill dropdown + caption -->
        <div class="status-group">
          <button class="status-pill-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Reading status: Reading">
            <span>Reading</span>
            <span class="status-caret" aria-hidden="true">▾</span>
          </button>
          <span class="status-caption">Started 2 Oct</span>
        </div>
      </section>

      <!-- Hairline divider -->
      <hr class="hairline-divider" aria-hidden="true">

      <!-- Printed Passage: Latest Note (No card container) -->
      <section class="note-passage-section" aria-label="Latest note">
        <p class="note-metadata">Latest note · p. 42 · 14 Oct · Quote</p>
        <blockquote class="note-quote">
          “Attention grows when we give one task our time.”
        </blockquote>
        <a href="#all-notes" class="note-all-link" aria-label="View all 3 notes">
          All 3 notes ›
        </a>
      </section>

      <!-- Single Primary Button: Add note -->
      <button class="btn-primary" type="button">
        Add note
      </button>

      <!-- Below the Fold: Collapsed Information Rows -->
      <section class="details-list" aria-label="Book sections">

        <!-- My review -->
        <div class="list-row" role="button" tabindex="0">
          <div class="row-content">
            <span class="row-label">My review</span>
            <span class="row-summary">A gentle book about doing less…</span>
          </div>
          <div class="row-right">
            <span class="chevron" aria-hidden="true">›</span>
          </div>
        </div>

        <!-- Saved pages -->
        <div class="list-row" role="button" tabindex="0">
          <div class="row-meta-single">
            <span class="row-label">Saved pages</span>
            <div class="row-right">
              <span class="row-caption-inline">1 page</span>
              <span class="chevron" aria-hidden="true">›</span>
            </div>
          </div>
        </div>

        <!-- Book information -->
        <div class="list-row" role="button" tabindex="0">
          <div class="row-meta-single">
            <span class="row-label">Book information</span>
            <div class="row-right">
              <span class="chevron" aria-hidden="true">›</span>
            </div>
          </div>
        </div>

        <!-- Ownership & condition -->
        <div class="list-row" role="button" tabindex="0">
          <div class="row-meta-single">
            <span class="row-label">Ownership & condition</span>
            <div class="row-right">
              <span class="chevron" aria-hidden="true">›</span>
            </div>
          </div>
        </div>

      </section>

      <!-- Secondary action: Remove from library -->
      <div class="remove-action-container">
        <button class="remove-action-btn" type="button">
          Remove from library
        </button>
      </div>

    </div>

  </main>

</body>
</html>
